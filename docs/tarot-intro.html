<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="tarot-page-title">Tarot – Monospring</title>
    <link rel="stylesheet" type="text/css" href="styles.css">
</head>

<body>

    <header class="site-header site-header--slim">
        <div class="header-inner">
            <a href="index.html" class="back-btn" data-i18n="back-home">← Back</a>
            <div class="site-brand site-brand--row">
                <img src="images/monospring_logo_s.png" alt="Monospring Logo" class="site-logo site-logo--sm">
                <span class="site-title">Monospring</span>
            </div>
            <div class="lang-switcher">
                <select id="lang-select" aria-label="Select Language">
                    <option value="en">EN</option>
                    <option value="zh">中文</option>
                    <option value="ja">日本語</option>
                    <option value="ko">한국어</option>
                    <option value="vi">Tiếng Việt</option>
                </select>
            </div>
        </div>
    </header>

    <main class="intro-content">

        <div class="intro-hero">
            <div class="intro-icon">🔮</div>
            <h1 class="intro-title" data-i18n="app-tarot-name">Tarot</h1>
            <p class="intro-tagline" data-i18n="tarot-tagline">Guidance from the cards.</p>
        </div>

        <p class="intro-desc" data-i18n="tarot-full-desc">Draw tarot cards daily and explore their rich symbolism and meanings. A digital companion for reflection, journaling, and spiritual curiosity.</p>

        <div class="action-buttons">
            <span class="card-btn coming-soon-btn action-btn" data-i18n="coming-soon">Coming Soon</span>
        </div>

    </main>

    <footer class="pfooter">
        <span data-i18n="footer-text">Here's our</span> <a href="privacy-policy.html" data-i18n="privacy-link">Privacy Policy</a>.
    </footer>

    <script src="i18n.js"></script>
</body>

</html>
